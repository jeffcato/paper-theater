[package]
name = "monotonic-align"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Conservative monotonic audio-to-text token alignment and reveal timestamp engine"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
thiserror = "2.0"
similar = "3.2"
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
