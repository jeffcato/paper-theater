[package]
name = "pt-runtime-checks"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
pt-contracts = { path = "../../../crates/pt-contracts" }
async-trait = "0.1"
