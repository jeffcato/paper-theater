[workspace]
members = ["crates/pt-contracts", "crates/pt-production", "crates/pt-server", "crates/dramatic-script", "crates/monotonic-align", "crates/timed-captions", "crates/atomic-journal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
pt-contracts = { path = "crates/pt-contracts" }
pt-production = { path = "crates/pt-production" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
async-trait = "0.1"
