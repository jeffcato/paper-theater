name: Product identity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-identity:
    name: Check product identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check product names and content
        run: python3 tools/check_product_identity.py .
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Set up tested Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Install pinned web dependencies
        run: npm ci --ignore-scripts
      - name: Check shared contracts and applications
        run: npm run check:contracts && npm run check:player && npm run check:studio && npm run build
      - name: Build and scan delivery outputs
        run: cargo build -p pt-server --locked && python3 tools/check_product_identity.py apps/studio/dist apps/audience/dist target/debug/pt-server
      - name: Test complete offline generation helpers
        run: env -u SOURCE_ROOT python3 -B -m unittest discover -s tools/generation -p 'test_*.py'
      - name: Verify real backend process restart and private replay
        run: env -u SOURCE_ROOT python3 -B crates/pt-server/tests/chapter_runtime_process.py --receipt "$RUNNER_TEMP/pt-backend-restart.json"
